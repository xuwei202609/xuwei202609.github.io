<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BELONG · 本机 API 配置</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efe4;color:#302821;font:16px/1.65 Arial,sans-serif}main{max-width:660px;margin:8vh auto;padding:36px;background:#fffdf8;border:1px solid #ddd1bf;border-radius:12px}h1{font-size:26px}label{display:block;margin-top:22px}input{width:100%;padding:13px;border:1px solid #b4a18b;border-radius:6px;font:inherit}button,a{font:inherit}button{margin-top:24px;padding:12px 22px;background:#624932;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.6}#status{white-space:pre-wrap}a{color:#624932}small{display:block;color:#72665a}code{overflow-wrap:anywhere}@media(max-width:700px){main{margin:20px;padding:24px}}</style><main><p>B E L O N G</p><h1>连接 AI Companion</h1><p>模型：<code>deepseek-v4.1-flash</code></p><p>这是仅本机可访问的配置页。请在这里填写千问平台的<strong>按量付费 API Key</strong>，无需发送到聊天里。密钥将由 Windows 加密保存在网页文件夹之外。</p><form id="setup"><label for="key">API Key</label><input id="key" type="password" autocomplete="off" required placeholder="粘贴完整的 API Key"><label for="base">Base URL / OpenAI 兼容接口地址</label><input id="base" type="url" required value="https://cn-beijing.maas.qianwenaiapi.com/compatible-mode/v1"><small>如千问控制台显示了不同的业务空间地址，请使用控制台的地址。</small><button id="connect" type="submit">保存并连接</button><p id="status" role="status" aria-live="polite"></p></form><small>连接检查会向所选模型发送一条极短的测试请求，按账户实际用量计费。</small><p><a href="/#14:45">打开 AI Companion</a></p></main><script>const form=document.querySelector('form'),button=document.querySelector('button'),status=document.querySelector('#status');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='正在验证模型连接并加密保存…';try{const response=await fetch(location.pathname+'/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:document.querySelector('#key').value,baseUrl:document.querySelector('#base').value})});const result=await response.json();if(!response.ok)throw Error(result.error||'连接失败，请检查账户设置。');document.querySelector('#key').value='';status.textContent='连接成功！密钥已加密保存。现在可以打开 AI Companion 自由聊天。';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});</script></html>
